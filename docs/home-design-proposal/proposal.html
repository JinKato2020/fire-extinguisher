const params=new URLSearchParams(location.search),mode=params.get('mode')||'compare',type=params.get('style')||'anime';let html='';
if(mode==='single'||mode==='full')html=`<div class="board single ${mode==='full'?'full':''}">${variant(type)}</div>`;
else if(mode==='detail')html=`<div class="board detailboard full">${header('開いたら、迷わず次の一歩へ。','学習を再開する → 積み重ねに気づく → 自分で選ぶ、の順に整理。')}<div class="detail-grid">${phone('anime')}<aside class="annotations"><div class="note"><h3><span class="n">1</span>ヒーローは「学習の気分」をつくる</h3><p>縦長のタイトル画像を横長に。最初の画面に学習ボタンが収まり、好きな見た目も楽しめます。画像と文字を分け、文字サイズの変更にも対応する想定です。</p></div><div class="note"><h3><span class="n">2</span>いちばん目立つのは「続きから学ぶ」</h3><p>毎回、章を探し直さずに再開。前回読んだ教材を大きなボタンで案内します。初回は「第1章から始める」、学習後は「今日の復習へ」に切り替える案です。</p></div><div class="note"><h3><span class="n">3</span>問題を解かない日も、学びを認める</h3><p>教材・用語・クイズを別々に記録。連続日数だけで評価せず、「今週、何日学べたか」を見せます。休んだ後も戻りやすい表現にします。</p></div><div class="note"><h3><span class="n">4</span>選択肢は整理し、学習の入口を残す</h3><p>教材・用語・模試・相関図をコンパクトに配置。お気に入りと問題ブックマークは、その下の補助導線へ。既存の5タブは共通の位置を保ちます。</p></div><div class="note"><h3><span class="n">5</span>期限と成績は、次の行動につなげる</h3><p>試験日と詳しい成績は下側へ。未設定なら「試験日を登録」と表示します。「合格圏／弱点あり」の断定より、学習の進み具合と次に復習する内容を案内します。</p></div><p class="proposal-caption">※ 教材の読書位置、学習済みレッスン、用語の学習記録などは新たな実装が必要な提案です。画像内の数字はユーザーの実績ではありません。</p></aside></div></div>`;
else if(mode==='settings')html=`<div class="board detailboard settingsboard">${header('好きな見た目に。操作は、いつもの場所に。','ヒーローの種類と、画面の明るさは別々に選べる構成。')}<div class="detail-grid"><div id="custom-phone">${phone('anime')}</div><aside class="annotations"><div class="note"><h3><span class="n">1</span>ホームの「着せ替え」から変更</h3><p>設定を探し回らず、いま見ている画像から選べます。候補を選ぶと選択枠で明示し、最後のボタンで適用します。</p></div><div class="note"><h3><span class="n">2</span>好みに合わせて4種類</h3><p>親しみのあるアニメ、専門職をイメージする実写、人物なしの風景。画像を減らして集中したい人には「画像なし」も用意する案です。</p></div><div class="note"><h3><span class="n">3</span>アニメでも、ダークモードでも</h3><p>画像と配色を独立させます。「アニメ＋ダーク」「風景＋ライト」などを自由に組み合わせ、最後に選んだ設定を端末に保存する想定です。</p></div><div class="mini-logic"><div class="logic"><b>位置は変えない</b>画像を変更しても、学習ボタンとメニューは共通。</div><div class="logic"><b>勝手に切り替えない</b>自動カルーセルや点滅を使わず、落ち着いて学べる。</div></div><p class="proposal-caption">※ このページは確認用のモックアップです。アプリ本体の変更・配信は行っていません。</p></aside></div></div>`;
else html=`<div class="board">${header('学びに戻りたくなる、3つのホーム。','基本の構成は共通。ヒーローと配色を、自分の好みに合わせて。')}<div class="columns">${['anime','photo','calm'].map(variant).join('')}</div><div class="board-footer"><div><b>まず「続きから学ぶ」</b>最初の画面に、再開ボタンと今日の学びを。</div><div><b>読むだけの日も、積み重ねに</b>教材・用語・クイズを、それぞれ見える形に。</div><div><b>見た目は選べる。操作は共通。</b>画像なし・ライト／ダークも選べる想定です。</div></div></div>`;
document.getElementById('root').innerHTML=html;
function attachSheet(target){target.querySelector('.scrim')?.remove();target.querySelector('.sheet')?.remove();target.insertAdjacentHTML('beforeend',sheet());target.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{target.querySelectorAll('.choice').forEach(x=>x.classList.remove('chosen'));el.classList.add('chosen')});target.querySelectorAll('.segmented button').forEach(el=>el.onclick=()=>{target.querySelectorAll('.segmented button').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')});const close=()=>{target.querySelector('.scrim')?.remove();target.querySelector('.sheet')?.remove()};target.querySelector('.cancel').onclick=close;target.querySelector('.apply').onclick=close;}
document.querySelectorAll('.customize').forEach(el=>el.onclick=()=>attachSheet(el.closest('.phone')));
if(mode==='settings')attachSheet(document.querySelector('#custom-phone .phone'));
</script>
