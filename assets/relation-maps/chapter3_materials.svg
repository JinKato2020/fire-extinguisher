<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="title desc">
<title id="title">第3章：荷重が同じでも、応力や伸びが変わるのはなぜ？</title>
<desc id="desc">材料に荷重 Fから、面積で割る、内部の負担。材料に荷重 Fから、伸びを元長で割る、変形の割合。内部の負担から、応力を見る、材料の性質と照合。変形の割合から、ひずみを見る、材料の性質と照合。材料の性質と照合から、強さの基準と比較、限界と安全を判断</desc>
