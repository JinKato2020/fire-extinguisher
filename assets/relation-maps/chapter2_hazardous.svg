<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="title desc">
<title id="title">第2章：一般の建物と危険物施設で、何を切り替える？</title>
<desc id="desc">対象を確認から、建物の基準、一般の防火対象物。対象を確認から、施設の基準、危険物施設。一般の防火対象物から、用途別に判断、消火器具の基準。危険物施設から、消火困難性等、消火設備の区分。消火器具の基準から、建物側の条件、対象の基準で算定。消火設備の区分から、施設側の条件、対象の基準で算定</desc>
