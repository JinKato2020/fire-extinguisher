<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1004" viewBox="0 0 720 1004" role="img" aria-labelledby="title desc">
<title id="title">第6章：名前が思い出せないとき、どこから考える？</title>
<desc id="desc">位置と形を確認から、組み込まれた部品、消火器の部品。位置と形を確認から、作業に使う器具、点検・整備の器具。消火器の部品から、働きをたどる、役割を言葉にする。点検・整備の器具から、作業と結び付ける、用途を言葉にする。役割を言葉にするから、役割から名称へ、名称と理由を対応。用途を言葉にするから、用途から名称へ、名称と理由を対応</desc>
