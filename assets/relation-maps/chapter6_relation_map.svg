<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1264" viewBox="0 0 720 1264" role="img" aria-labelledby="title desc">
<title id="title">第6章：一つの特徴だけで、消火器の種類を断定していない？</title>
<desc id="desc">図と表示を見るから、圧力はどこから？、圧力源の手掛かり。図と表示を見るから、何を放射する？、薬剤の手掛かり。圧力源の手掛かりから、方式を絞る、加圧方式の候補。薬剤の手掛かりから、薬剤を絞る、薬剤の候補。加圧方式の候補から、方式の証拠、候補を照合する。薬剤の候補から、薬剤の証拠、候補を照合する。候補を照合するから、整合したら回答、名称と根拠を回答</desc>
