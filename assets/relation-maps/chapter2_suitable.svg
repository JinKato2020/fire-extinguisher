<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="title desc">
<title id="title">第2章：薬剤は、火災の種類だけで選んでよい？</title>
<desc id="desc">消火器を選ぶから、何が燃える？、適応する火災。消火器を選ぶから、どこで使う？、設置場所の条件。適応する火災から、火災に適応、薬剤と放射形態。設置場所の条件から、場所に適合、使用・設置の制限。薬剤と放射形態から、薬剤側の条件、使える器種を選定。使用・設置の制限から、場所側の条件、使える器種を選定</desc>
