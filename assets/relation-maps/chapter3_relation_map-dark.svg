<svg xmlns="http://www.w3.org/2000/svg" width="720" height="716" viewBox="0 0 720 716" role="img" aria-labelledby="title desc">
<title id="title">第3章：力が回転・移動・変形にどう結び付く？</title>
<desc id="desc">力 F を整理から、回転を考える、回そうとする作用。力 F を整理から、移動を考える、動かす作用。回そうとする作用から、腕の長さを掛ける、モーメント。動かす作用から、同方向の場合、仕事</desc>
<rect width="720" height="716" fill="#191D25"/>
<g font-family="Meiryo, Noto Sans CJK JP, sans-serif">
