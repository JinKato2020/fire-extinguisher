<rect x="444.0" y="213.68" width="192.0" height="48" rx="8" fill="#191D25"/>
<text x="540.0" y="246.68" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">移動を考える</text>
<rect x="56.0" y="473.68" width="248.0" height="48" rx="8" fill="#191D25"/>
<text x="180.0" y="506.68" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">腕の長さを掛ける</text>
<rect x="444.0" y="473.68" width="192.0" height="48" rx="8" fill="#191D25"/>
<text x="540.0" y="506.68" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">同方向の場合</text>
