<path d="M 26 306 V 410" stroke="#F3C37E" stroke-width="6" stroke-linecap="round"/>
<text x="180.0" y="332.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F3C37E">回そうとする作用</text>
<text x="180.0" y="386.0" text-anchor="middle" font-size="27" font-weight="500" fill="#EEF1F6">支点からの垂直距離 d</text>
</g>
<g id="node-c">
<rect x="384" y="284" width="312" height="148" rx="16" fill="#191D25" stroke="#506078" stroke-width="2"/>
<path d="M 386 306 V 410" stroke="#F3C37E" stroke-width="6" stroke-linecap="round"/>
<text x="540.0" y="332.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F3C37E">動かす作用</text>
<text x="540.0" y="386.0" text-anchor="middle" font-size="27" font-weight="500" fill="#EEF1F6">力方向の移動距離 s</text>
</g>
<g id="node-d">
