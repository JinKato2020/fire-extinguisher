<text x="540.0" y="592.0" text-anchor="middle" font-size="34" font-weight="700" fill="#83D5BB">仕事</text>
<text x="540.0" y="646.0" text-anchor="middle" font-size="27" font-weight="500" fill="#EEF1F6">W = F × s</text>
</g>
