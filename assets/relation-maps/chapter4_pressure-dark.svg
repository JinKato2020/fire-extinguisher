<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="title desc">
<title id="title">第4章：蓄圧式とガス加圧式は、いつ圧力がかかる？</title>
<desc id="desc">圧力源を確認から、平常時から加圧、蓄圧式。圧力源を確認から、作動時に加圧、ガス加圧式。蓄圧式から、操作すると、弁を開く。ガス加圧式から、操作すると、ガス容器を開く。弁を開くから、本体内の圧力、薬剤を押し出す。ガス容器を開くから、本体内の圧力、薬剤を押し出す</desc>
