<text x="360.0" y="246.68" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">基準に当てはめる</text>
<rect x="84.0" y="473.68" width="192.0" height="48" rx="8" fill="#191D25"/>
<text x="180.0" y="506.68" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">どの範囲に？</text>
<rect x="444.0" y="473.68" width="192.0" height="48" rx="8" fill="#191D25"/>
<text x="540.0" y="506.68" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">例外はある？</text>
<rect x="98.0" y="697.84" width="164.0" height="48" rx="8" fill="#191D25"/>
<text x="180.0" y="730.84" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">原則を確認</text>
<rect x="458.0" y="697.84" width="164.0" height="48" rx="8" fill="#191D25"/>
<text x="540.0" y="730.84" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">適用を補正</text>
<rect x="236.0" y="993.6800000000001" width="248.0" height="48" rx="8" fill="#191D25"/>
<text x="360.0" y="1026.68" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">基準に従って設置</text>
