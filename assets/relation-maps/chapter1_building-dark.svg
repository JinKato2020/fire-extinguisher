<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1236" viewBox="0 0 720 1236" role="img" aria-labelledby="title desc">
<title id="title">第1章：用途や建物の条件は、設備の設置にどうつながる？</title>
<desc id="desc">建物の条件から、基準に当てはめる、必要な設備を判断。必要な設備を判断から、どの範囲に？、設置の単位。必要な設備を判断から、例外はある？、例外・変更条件。設置の単位から、原則を確認、適用基準を確定。例外・変更条件から、適用を補正、適用基準を確定。適用基準を確定から、基準に従って設置、設置・届出・検査</desc>
