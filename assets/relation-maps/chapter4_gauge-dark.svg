<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="title desc">
<title id="title">第4章：指示圧力計が緑色範囲なら、薬剤量も分かる？</title>
<desc id="desc">周囲の温度が変化から、温度の影響、圧力が変化。圧力が変化から、計器が指示、針の位置を読む。針の位置を読むから、分かること、圧力の状態を判断。針の位置を読むから、これだけでは不明、薬剤量は別に確認</desc>
<rect width="720" height="976" fill="#191D25"/>
<g font-family="Meiryo, Noto Sans CJK JP, sans-serif">
