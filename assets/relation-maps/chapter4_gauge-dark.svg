<path d="M 386 826 V 930" stroke="#F3C37E" stroke-width="6" stroke-linecap="round"/>
<text x="540.0" y="852.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F3C37E">薬剤量は別に確認</text>
<text x="540.0" y="906.0" text-anchor="middle" font-size="27" font-weight="500" fill="#EEF1F6">残量計ではない</text>
