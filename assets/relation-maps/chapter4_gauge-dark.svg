<path d="M 360.0 694 V 725.6 H 540.0 V 788" fill="none" stroke="#91A7BE" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M 532.0 785 L 540.0 799 L 548.0 785 Z" fill="#91A7BE"/>
<rect x="278.0" y="213.68" width="164.0" height="48" rx="8" fill="#191D25"/>
<text x="360.0" y="246.68" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">温度の影響</text>
<rect x="278.0" y="473.68" width="164.0" height="48" rx="8" fill="#191D25"/>
<text x="360.0" y="506.68" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">計器が指示</text>
<rect x="98.0" y="733.6800000000001" width="164.0" height="48" rx="8" fill="#191D25"/>
<text x="180.0" y="766.6800000000001" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">分かること</text>
<rect x="416.0" y="733.6800000000001" width="248.0" height="48" rx="8" fill="#191D25"/>
<text x="540.0" y="766.6800000000001" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">これだけでは不明</text>
<g id="node-a">
<rect x="204" y="24" width="312" height="148" rx="16" fill="#191D25" stroke="#506078" stroke-width="2"/>
<path d="M 206 46 V 150" stroke="#F3C37E" stroke-width="6" stroke-linecap="round"/>
<text x="360.0" y="72.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F3C37E">周囲の温度が変化</text>
<text x="360.0" y="126.0" text-anchor="middle" font-size="27" font-weight="500" fill="#EEF1F6">本体内の圧力に影響</text>
</g>
<g id="node-b">
<rect x="204" y="284" width="312" height="148" rx="16" fill="#191D25" stroke="#506078" stroke-width="2"/>
<path d="M 206 306 V 410" stroke="#8EC5EE" stroke-width="6" stroke-linecap="round"/>
<text x="360.0" y="332.0" text-anchor="middle" font-size="34" font-weight="700" fill="#8EC5EE">圧力が変化</text>
<text x="360.0" y="386.0" text-anchor="middle" font-size="27" font-weight="500" fill="#EEF1F6">指示圧力計に伝わる</text>
</g>
<g id="node-c">
<rect x="204" y="544" width="312" height="148" rx="16" fill="#191D25" stroke="#506078" stroke-width="2"/>
<path d="M 206 566 V 670" stroke="#8EC5EE" stroke-width="6" stroke-linecap="round"/>
<text x="360.0" y="592.0" text-anchor="middle" font-size="34" font-weight="700" fill="#8EC5EE">針の位置を読む</text>
<text x="360.0" y="646.0" text-anchor="middle" font-size="27" font-weight="500" fill="#EEF1F6">所定の使用圧力範囲か</text>
</g>
<g id="node-d">
<rect x="24" y="804" width="312" height="148" rx="16" fill="#191D25" stroke="#506078" stroke-width="2"/>
