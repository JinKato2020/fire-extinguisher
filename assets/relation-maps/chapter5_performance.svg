<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="title desc">
<title id="title">第5章：能力の数値、火災への適応、塗色は同じ意味？</title>
<desc id="desc">消火器の表示から、どれだけの能力？、能力の数値。消火器の表示から、何の火災に？、適応する火災。能力の数値から、数値で比較、必要な能力と比較。適応する火災から、適応を照合、対象の火災と照合。必要な能力と比較から、能力の条件、性能と用途を確認。対象の火災と照合から、用途の条件、性能と用途を確認</desc>
