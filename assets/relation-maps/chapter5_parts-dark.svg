<title id="title">第5章：操作・部品・安全装置は、何のために規格がある？</title>
<desc id="desc">安全・確実な使用から、人の操作、意図した操作。安全・確実な使用から、内部の圧力、圧力を安全に扱う。意図した操作から、動作・表示の規格、確実に作動。圧力を安全に扱うから、強さ・安全の規格、圧力を保持・制御。確実に作動から、操作が伝わる、薬剤を正しく放射。圧力を保持・制御から、圧力で押し出す、薬剤を正しく放射</desc>
