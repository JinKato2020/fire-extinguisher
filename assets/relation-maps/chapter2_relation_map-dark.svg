<text x="108" y="1494.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">危険物・指定可燃物・電気設備</text>
<path d="M 740 1540 C 690 1540 695 1572.0 640 1572.0 L 90 1572.0" fill="none" stroke="#7FCBB9" stroke-width="3" opacity="0.55"/>
<text x="108" y="1558.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">火気使用場所の条件も確認</text>
<path d="M 1080 1750 C 1025 1750 1040 1760 990 1760 L 740 1760" fill="none" stroke="#7FCBB9" stroke-width="7" opacity="0.85"/>
<text x="755" y="1742" text-anchor="start" font-size="36" font-weight="700" fill="#7FCBB9">大型消火器</text>
<path d="M 740 1760 C 690 1760 695 1728.0 640 1728.0 L 90 1728.0" fill="none" stroke="#7FCBB9" stroke-width="3" opacity="0.55"/>
<text x="108" y="1714.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">指定可燃物の多量貯蔵など</text>
<path d="M 740 1760 C 690 1760 695 1792.0 640 1792.0 L 90 1792.0" fill="none" stroke="#7FCBB9" stroke-width="3" opacity="0.55"/>
<text x="108" y="1778.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">能力・薬剤量・配置を照合する</text>
<path d="M 1080 1750 C 1025 1750 1040 1980 990 1980 L 740 1980" fill="none" stroke="#7FCBB9" stroke-width="7" opacity="0.85"/>
<text x="755" y="1962" text-anchor="start" font-size="36" font-weight="700" fill="#7FCBB9">減少措置</text>
<path d="M 740 1980 C 690 1980 695 1948.0 640 1948.0 L 90 1948.0" fill="none" stroke="#7FCBB9" stroke-width="3" opacity="0.55"/>
<text x="108" y="1934.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">他の消火設備の有効範囲を確認</text>
