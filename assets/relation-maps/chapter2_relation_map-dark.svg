: [&quot;消火器＋簡易消火用具&quot;, &quot;水バケツ・水槽・乾燥砂など&quot;], &quot;references&quot;: [&quot;準備&quot;, &quot;Lesson 02&quot;]}, {&quot;name&quot;: &quot;火災への適応&quot;, &quot;lines&quot;: [&quot;油火災・電気火災への適応を確認&quot;, &quot;薬剤と放射形態を組み合わせる&quot;], &quot;references&quot;: [&quot;Lesson 03&quot;]}, {&quot;name&quot;: &quot;場所の制限&quot;, &quot;lines&quot;: [&quot;換気不良の場所では薬剤に注意&quot;, &quot;地下街などの使用制限を確認&quot;], &quot;references&quot;: [&quot;Lesson 04&quot;]}]}, {&quot;title&quot;: &quot;届く位置に置く&quot;, &quot;topics&quot;: [{&quot;name&quot;: &quot;歩行距離&quot;, &quot;lines&quot;: [&quot;一般の消火器具は20m以下&quot;, &quot;大型消火器は該当基準で30m以下&quot;], &quot;references&quot;: [&quot;Lesson 04&quot;]}, {&quot;name&quot;: &quot;見つけやすさ&quot;, &quot;lines&quot;: [&quot;通行・避難・使用に便利な場所&quot;, &quot;標識を付け、すぐ取り出せる&quot;], &quot;references&quot;: [&quot;Lesson 04&quot;]}, {&quot;name&quot;: &quot;保管環境&quot;, &quot;lines&quot;: [&quot;湿気・振動・腐食を避ける&quot;, &quot;設置高さと転倒防止も確認&quot;], &quot;references&quot;: [&quot;Lesson 04&quot;]}]}, {&quot;title&quot;: &quot;危険物施設&quot;, &quot;topics&quot;: [{&quot;name&quot;: &quot;別の基準&quot;, &quot;lines&quot;: [&quot;一般建物と危険物施設を区別&quot;, &quot;施設の危険性に応じて選定&quot;], &quot;references&quot;: [&quot;Lesson 05&quot;]}, {&quot;name&quot;: &quot;設備の区分&quot;, &quot;lines&quot;: [&quot;第1種〜第5種の消火設備&quot;, &quot;大型消火器と小型消火器を区別&quot;], &quot;references&quot;: [&quot;Lesson 05&quot;]}, {&quot;name&quot;: &quot;所要単位&quot;, &quot;lines&quot;: [&quot;建築物・危険物などを分ける&quot;, &quot;所要単位に見合う消火設備へ&quot;], &quot;references&quot;: [&quot;Lesson 05&quot;]}]}], &quot;source&quot;: &quot;教材解説\\教材_第2章_消防関係法令(第6類).md&quot;, &quot;officialSources&quot;: [{&quot;title&quot;: &quot;消防庁：検定制度について&quot;, &quot;url&quot;: &quot;https://www.fdma.go.jp/mission/prevention/post-15.html&quot;}, {&quot;title&quot;: &quot;消防庁：消防用設備等の点検基準・点検要領&quot;, &quot;url&quot;: &quot;https://www.fdma.go.jp/mission/prevention/post-1.html&quot;}, {&quot;title&quot;: &quot;消防試験研究センター：消防設備士試験&quot;, &quot;url&quot;: &quot;https: