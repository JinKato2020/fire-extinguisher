<text x="3292" y="614.0" text-anchor="end" font-size="32" font-weight="500" fill="#E4EDF5">換気不良の場所では薬剤に注意</text>
<path d="M 2660 660 C 2710 660 2705 692.0 2760 692.0 L 3310 692.0" fill="none" stroke="#E2B269" stroke-width="3" opacity="0.55"/>
<text x="3292" y="678.0" text-anchor="end" font-size="32" font-weight="500" fill="#E4EDF5">地下街などの使用制限を確認</text>
