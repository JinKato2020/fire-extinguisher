<title id="title">第2章：必要な能力を満たせば、本数と置き場所は決まる？</title>
<desc id="desc">用途・面積・階から、設置が必要なら、必要な能力を算定。必要な能力を算定から、能力を確保、能力を満たす本数。必要な能力を算定から、配置も検討、使える位置に配置。能力を満たす本数から、必要量を満たす、本数と配置を確定。使える位置に配置から、届く範囲を満たす、本数と配置を確定</desc>
