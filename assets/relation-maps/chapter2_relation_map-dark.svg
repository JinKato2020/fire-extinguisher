<g font-family="Meiryo, Noto Sans CJK JP, sans-serif" fill="#E4EDF5" stroke-linecap="round" stroke-linejoin="round">
<text x="1700" y="78" text-anchor="middle" font-size="44" font-weight="700" fill="#E4EDF5">第2章  消防関係法令（第6類）</text>
<text x="1700" y="128" text-anchor="middle" font-size="30" font-weight="500" fill="#A3B4C5">中心から外へ、用語の役割とつながりをたどる</text>
<path d="M 1510 1100 C 1440 1100 1450 430 1390 430 L 1080 430" fill="none" stroke="#81B9E2" stroke-width="17" opacity="1"/>
<text x="1090" y="402" text-anchor="start" font-size="48" font-weight="700" fill="#81B9E2">対象を決める</text>
<path d="M 1080 430 C 1025 430 1040 220 990 220 L 740 220" fill="none" stroke="#81B9E2" stroke-width="7" opacity="0.85"/>
<text x="755" y="202" text-anchor="start" font-size="36" font-weight="700" fill="#81B9E2">用途と規模</text>
<path d="M 740 220 C 690 220 695 188.0 640 188.0 L 90 188.0" fill="none" stroke="#81B9E2" stroke-width="3" opacity="0.55"/>
<text x="108" y="174.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">用途・面積から設置義務を判断</text>
<path d="M 740 220 C 690 220 695 252.0 640 252.0 L 90 252.0" fill="none" stroke="#81B9E2" stroke-width="3" opacity="0.55"/>
<text x="108" y="238.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">面積に関係なく必要な用途もある</text>
<path d="M 1080 430 C 1025 430 1040 440 990 440 L 740 440" fill="none" stroke="#81B9E2" stroke-width="7" opacity="0.85"/>
<text x="755" y="422" text-anchor="start" font-size="36" font-weight="700" fill="#81B9E2">階と開口部</text>
<path d="M 740 440 C 690 440 695 408.0 640 408.0 L 90 408.0" fill="none" stroke="#81B9E2" stroke-width="3" opacity="0.55"/>
<text x="108" y="394.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">地下階・無窓階などを確認</text>
<path d="M 740 440 C 690 440 695 472.0 640 472.0 L 90 472.0" fill="none" stroke="#81B9E2" stroke-width="3" opacity="0.55"/>
<text x="108" y="458.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">建物全体と各階の条件を区別</text>
<path d="M 1080 430 C 1025 430 1040 660 990 660 L 740 660" fill="none" stroke="#81B9E2" stroke-width="7" opacity="0.85"/>
<text x="755" y="642" text-anchor="start" font-size="36" font-weight="700" fill="#81B9E2">複合用途</text>
<path d="M 740 660 C 690 660 695 628.0 640 628.0 L 90 628.0" fill="none" stroke="#81B9E2" stroke-width="3" opacity="0.55"/>
<text x="108" y="614.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">用途ごとの部分に着目する</text>
<path d="M 740 660 C 690 660 695 692.0 640 692.0 L 90 692.0" fill="none" stroke="#81B9E2" stroke-width="3" opacity="0.55"/>
<text x="108" y="678.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">建物全体への規定も確認する</text>
<path d="M 1510 1100 C 1440 1100 1450 1090 1390 1090 L 1080 1090" fill="none" stroke="#96B8CF" stroke-width="17" opacity="1"/>
<text x="1090" y="1062" text-anchor="start" font-size="48" font-weight="700" fill="#96B8CF">能力を数える</text>
<path d="M 1080 1090 C 1025 1090 1040 880 990 880 L 740 880" fill="none" stroke="#96B8CF" stroke-width="7" opacity="0.85"/>
<text x="755" y="862" text-anchor="start" font-size="34" font-weight="700" fill="#96B8CF">2つの能力単位</text>
<path d="M 740 880 C 690 880 695 848.0 640 848.0 L 90 848.0" fill="none" stroke="#96B8CF" stroke-width="3" opacity="0.55"/>
<text x="108" y="834.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">能力単位＝消火器側の消火力</text>
<path d="M 740 880 C 690 880 695 912.0 640 912.0 L 90 912.0" fill="none" stroke="#96B8CF" stroke-width="3" opacity="0.55"/>
