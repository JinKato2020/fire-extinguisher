<path d="M 1080 1750 C 1025 1750 1040 1540 990 1540 L 740 1540" fill="none" stroke="#7FCBB9" stroke-width="7" opacity="0.85"/>
<text x="755" y="1522" text-anchor="start" font-size="28" font-weight="700" fill="#7FCBB9">危険に応じて追加</text>
