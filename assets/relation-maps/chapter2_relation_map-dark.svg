<path d="M 740 1100 C 690 1100 695 1132.0 640 1132.0 L 90 1132.0" fill="none" stroke="#96B8CF" stroke-width="3" opacity="0.55"/>
<text x="108" y="1118.0" text-anchor="start" font-size="32" font-weight="500" fill="#E4EDF5">用途・構造に応じ基準を選ぶ</text>
<path d="M 1080 1090 C 1025 1090 1040 1320 990 1320 L 740 1320" fill="none" stroke="#96B8CF" stroke-width="7" opacity="0.85"/>
