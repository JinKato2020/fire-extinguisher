<text x="2645" y="422" text-anchor="end" font-size="36" font-weight="700" fill="#E2B269">火災への適応</text>
<path d="M 2660 440 C 2710 440 2705 408.0 2760 408.0 L 3310 408.0" fill="none" stroke="#E2B269" stroke-width="3" opacity="0.55"/>
<text x="3292" y="394.0" text-anchor="end" font-size="32" font-weight="500" fill="#E4EDF5">油火災・電気火災への適応を確認</text>
<path d="M 2660 440 C 2710 440 2705 472.0 2760 472.0 L 3310 472.0" fill="none" stroke="#E2B269" stroke-width="3" opacity="0.55"/>
<text x="3292" y="458.0" text-anchor="end" font-size="32" font-weight="500" fill="#E4EDF5">薬剤と放射形態を組み合わせる</text>
<path d="M 2320 430 C 2375 430 2360 660 2410 660 L 2660 660" fill="none" stroke="#E2B269" stroke-width="7" opacity="0.85"/>
<text x="2645" y="642" text-anchor="end" font-size="36" font-weight="700" fill="#E2B269">場所の制限</text>
