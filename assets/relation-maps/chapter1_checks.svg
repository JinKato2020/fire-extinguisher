<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="title desc">
<title id="title">第1章：防火対象物点検と、設備の点検報告を区別できる？</title>
<desc id="desc">点検の対象を確認から、管理を確認、防火対象物点検。点検の対象を確認から、設備を確認、消防用設備等点検。防火対象物点検から、制度を照合、対象・資格・周期。消防用設備等点検から、内容を照合、機器・総合点検。対象・資格・周期から、該当する報告、必要な報告を行う。機器・総合点検から、点検結果を報告、必要な報告を行う</desc>
