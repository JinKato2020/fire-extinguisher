<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc">
<title id="title">第6章：知っている内容を、設問に合う答えにできる？</title>
<desc id="desc">設問を確認から、図から説明、名称・理由の問題。設問を確認から、量を求める、計算の問題。名称・理由の問題から、何のための部品？、語句を選ぶ。計算の問題から、何が一定か？、適切な式で計算。語句を選ぶから、要点を文章にする、指定に沿って回答。適切な式で計算から、単位まで確認、指定に沿って回答。指定に沿って回答から、解答例と照合、根拠を照合・復習</desc>
