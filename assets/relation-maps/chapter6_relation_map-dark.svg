t;: [&quot;クランプ台 → 本体容器を固定&quot;, &quot;キャップスパナ → キャップ開閉&quot;], &quot;references&quot;: [&quot;Lesson 02&quot;]}, {&quot;name&quot;: &quot;清掃・観察&quot;, &quot;lines&quot;: [&quot;エアーガン → 清掃・通気確認&quot;, &quot;反射鏡 → 容器内部を観察&quot;], &quot;references&quot;: [&quot;Lesson 02&quot;]}, {&quot;name&quot;: &quot;圧力を扱う&quot;, &quot;lines&quot;: [&quot;耐圧試験機 → 水圧試験&quot;, &quot;圧力調整器 → ガスを減圧&quot;], &quot;references&quot;: [&quot;Lesson 02&quot;]}]}, {&quot;title&quot;: &quot;測定を読む&quot;, &quot;topics&quot;: [{&quot;name&quot;: &quot;指示・標準圧力計&quot;, &quot;lines&quot;: [&quot;指示＝正常範囲かを見る&quot;, &quot;標準＝細かい圧力値を読む&quot;], &quot;references&quot;: [&quot;Lesson 02&quot;]}, {&quot;name&quot;: &quot;圧力の基準&quot;, &quot;lines&quot;: [&quot;絶対圧力＝真空を0とする&quot;, &quot;ゲージ圧力＝大気圧を0とする&quot;], &quot;references&quot;: [&quot;Lesson 02&quot;]}, {&quot;name&quot;: &quot;計算へつなぐ&quot;, &quot;lines&quot;: [&quot;与えられた量と単位を確認&quot;, &quot;第2章の設置数・第3章の式へ&quot;], &quot;references&quot;: [&quot;参考&quot;]}]}, {&quot;title&quot;: &quot;解答をつくる&quot;, &quot;topics&quot;: [{&quot;name&quot;: &quot;正式名称&quot;, &quot;lines&quot;: [&quot;薬剤・加圧方式まで具体的に&quot;, &quot;見分けた根拠と名称を一致させる&quot;], &quot;references&quot;: [&quot;Lesson 03&quot;]}, {&quot;name&quot;: &quot;位置と目的&quot;, &quot;lines&quot;: [&quot;どこに付くか → 何を防ぐか&quot;, &quot;役割を一文で説明する&quot;], &quot;references&quot;: [&quot;Lesson 03&quot;]}, {&quot;name&quot;: &quot;練習の順序&quot;, &quot;lines&quot;: [&quot;外観 → 名称 → 方式 → 用途&quot;, &quot;6問の例で理由まで確認する&quot;], &quot;references&quot;: [&quot;Lesson 03&quot;]}]}], &quot;source&quot;: &quot;教材解説\\教材_第6章_実技試験(鑑別等)関連.md&quot;, &quot;officialSources&quot;: [{&quot;title&quot;: &quot;消防庁：検定制度について&quot;, &quot;url&quot;: &quot;https://www.fdma.go.jp/mission/prevention/post-15.html&quot;}, {&quot;title&quot;: &quot;消防庁：消防用設備等の点検基準・点検要領&quot;, &quot;url&quot;: &quot;https://www.fdma.go.jp/mission/prevention/post-1.html&quot;}, {&quot;title&quot;: &quot;消防試験研究センター：消防設備士試験&quot;, &quot;url&quot;: &quot;https://www.shoubo-shiken.or.jp/shoubou/&quot;}, {&quot;title&quot;: &quot;e-Gov：消防法施行規則&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/336M50000008006&quot;}, {&quot;title&quot;: &quot;e-Gov：消火器の技術上の規格を定める省令&quot;, &quot;url&quot;: &quot;https://laws.e-gov.go.jp/law/339M50000008027&quot;}]}</metadata>
