<title id="title">第4章：消火は、燃焼のどの条件に働きかける？</title>
<desc id="desc">燃焼を続ける条件から、供給を調べる、燃料・酸素。燃焼を続ける条件から、継続条件を調べる、熱・連鎖反応。燃料・酸素から、供給を断つ、除去・窒息。熱・連鎖反応から、熱・反応を抑える、冷却・抑制。除去・窒息から、主な作用を照合、薬剤の作用を理解。冷却・抑制から、主な作用を照合、薬剤の作用を理解</desc>
