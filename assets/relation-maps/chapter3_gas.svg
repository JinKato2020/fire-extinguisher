<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="title desc">
<title id="title">第3章：気体の計算は、どの条件が一定かでどう変わる？</title>
<desc id="desc">一定量の気体から、温度を固定、温度が一定。一定量の気体から、圧力を固定、圧力が一定。温度が一定から、体積と圧力、ボイルの法則。圧力が一定から、体積と温度、シャルルの法則。ボイルの法則から、一般化すると、共通する関係。シャルルの法則から、一般化すると、共通する関係</desc>
