<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1004" viewBox="0 0 720 1004" role="img" aria-labelledby="title desc">
<title id="title">第4章：外観の異常や年数は、次の確認にどうつながる？</title>
<desc id="desc">外観・表示を確認から、状態と年数を照合、必要な点検を判断。必要な点検を判断から、該当する点検、内部・機能を確認。必要な点検を判断から、該当する耐圧点検、耐圧性能を確認。内部・機能を確認から、不具合を判断、結果に応じて対応。耐圧性能を確認から、耐圧の結果を判断、結果に応じて対応</desc>
