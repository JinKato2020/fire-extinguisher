<text x="180.0" y="758.84" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">不具合を判断</text>
<rect x="416.0" y="725.84" width="248.0" height="48" rx="8" fill="#191D25"/>
<text x="540.0" y="758.84" text-anchor="middle" font-size="28" font-weight="500" fill="#B7C2D0">耐圧の結果を判断</text>
<g id="node-a">
